<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Panel de edición · EFS</title>
  <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;800&family=Chivo+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: 'Chivo', sans-serif; color: #16283F; background: #EAF2F9; }
    main { max-width: 560px; padding: 40px 28px; border-left: 6px solid #16283F; background: #fff; margin: 20px; }
    span { font-family: 'Chivo Mono', monospace; font-size: 14px; background: #16283F; color: #fff; padding: 7px 10px; }
    h1 { font-weight: 800; font-size: 34px; line-height: 1; margin: 18px 0 12px; }
    p { font-size: 17px; line-height: 1.5; }
    a.btn { display: inline-block; margin-top: 12px; background: #16283F; color: #fff; padding: 12px 20px; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <span>Panel de edición</span>
    <h1>El panel ahora está en Pages CMS</h1>
    <p>El programa, las fotos, la fecha y la inscripción se editan desde Pages CMS, entrando con la cuenta de GitHub que tiene acceso al repositorio. Las instrucciones están en <code>INSTRUCTIVO.md</code>.</p>
    <a class="btn" href="https://app.pagescms.org">Abrir Pages CMS</a>
  </main>
</body>
</html>
